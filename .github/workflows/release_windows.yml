name: Windows Release

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'website/**', 'docs/**', '*.md' ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm get.scoop.sh | iex

          $shims = "$env:USERPROFILE\scoop\shims"
          Add-Content -Path $env:GITHUB_PATH -Value $shims
          $env:PATH = "$shims;$env:PATH"

      - name: Install dependencies
        shell: pwsh
        run: |
          scoop bucket add extras
          scoop bucket add versions

          scoop install git 7zip rustup llvm nodejs24 mingw uv
          rustup default stable

      - name: Install nu
        shell: pwsh
        run: |
          $version = "0.101.0"
          $arch = "x86_64-pc-windows-msvc"
          $url = "https://github.com/nushell/nushell/releases/download/$version/nu-$version-$arch.zip"
          Invoke-WebRequest -Uri $url -OutFile "nu.zip"
          Expand-Archive -Path "nu.zip" -DestinationPath "$env:LOCALAPPDATA\nu"
          Remove-Item "nu.zip"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\nu"

      - name: Set up pnpm
        run: |
          npm install -g pnpm@10
          pnpm setup

          cd ./ui

          pnpm approve-builds --all
          pnpm install --frozen-lockfile

          pnpm build

      - name: Install tauri-cli
        shell: pwsh
        run: |
          pnpm add -D @tauri-apps/cli

      - name: Last.fm keys
        if: ${{ env.LASTFM_API_KEY != '' && env.LASTFM_API_SECRET != '' }}
        shell: pwsh
        run: |
          "$env:LASTFM_API_KEY" | Out-File -FilePath "src-tauri/lastfm.keys" -Encoding utf8
          "$env:LASTFM_API_SECRET" | Out-File -FilePath "src-tauri/lastfm.keys" -Encoding utf8 -Append

      - name: Set env for build
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "LIMUSIC_LASTFM_API_KEY=$env:LASTFM_API_KEY"
          Add-Content -Path $env:GITHUB_ENV -Value "LIMUSIC_LASTFM_API_SECRET=$env:LASTFM_API_SECRET"

      - name: Locate MSVC tools
        shell: pwsh
        run: |
          Import-Module VSSetup -ErrorAction Stop

          $vs = Get-VSSetupInstance -Prerelease -All |
            Where-Object { $_.DisplayName -match "Visual Studio" } |
            Select-Object -First 1

          if (-not $vs) {
              throw "No Visual Studio instance found"
          }

          $vcToolsRoot = Join-Path $vs.InstallationPath "VC\Tools\MSVC"

          $msvcVersion = Get-ChildItem $vcToolsRoot -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          $vcToolsBin = Join-Path $msvcVersion.FullName "bin\Hostx64\x64"
          Add-Content -Path $env:GITHUB_PATH -Value $vcToolsBin

      - name: Download and prepare libmpv
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z" -OutFile "mpv-dev.7z"
          7z x "mpv-dev.7z" "-ompv-dev" -y

          $dll = Get-ChildItem "mpv-dev" -Recurse -File -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found in archive" }

          Copy-Item $dll.FullName "src-tauri\libmpv.dll" -Force

          $scriptPath = Join-Path $PWD "scripts\build\mpv.py"
          uv run --no-project --with pefile python $scriptPath $dll.FullName "src-tauri\mpv.def"

          & lib /def:"src-tauri\mpv.def" /out:"src-tauri\mpv.lib" /machine:x64

          Remove-Item "mpv-dev.7z" -Force
          Remove-Item "mpv-dev" -Recurse -Force

      - name: Set env for linker
        shell: pwsh
        run: |
          $srcDir = (Resolve-Path src-tauri).Path
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-L native=$srcDir"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$srcDir;$env:LIB"

      - name: build_bin
        shell: pwsh
        if: ${{ github.ref_type == 'tag' }}
        working-directory: ${{ github.workspace }}
        run: |
          nu scripts/build/ci.nu

      - name: create_release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
