name: Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build for (e.g. v0.3.0)
        required: true
        type: string
      dry_run:
        description: Build and verify, but don't attach to release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Pinned libmpv dev build (shinchiro). AVX2-free variant for broader CPU support.
  MPV_DEV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z
  MPV_DIR: ${{ github.workspace }}\.libmpv

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Validate tag
        id: rel
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || { echo "::error::no tag specified"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - name: Verify version matches tag
        shell: bash
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          [ "v$VERSION" = "${{ steps.rel.outputs.tag }}" ] || {
            echo "::error::tauri.conf.json version $VERSION doesn't match tag ${{ steps.rel.outputs.tag }}"
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend
        shell: bash
        run: |
          npm install -g pnpm@10
          cd ui && pnpm install --frozen-lockfile

      - name: Rust
        shell: bash
        run: rustup default stable-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm install -g "@tauri-apps/cli@^2"

      - name: Build libmpv import library
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:MPV_DIR" | Out-Null

          # Download and extract libmpv dev package
          curl.exe -fsSL -o "$env:MPV_DIR\mpv-dev.7z" "$env:MPV_DEV_URL"
          7z x "$env:MPV_DIR\mpv-dev.7z" -o"$env:MPV_DIR" -y | Out-Null

          # Build MSVC import lib from MinGW DLL exports
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          Set-Location "$env:MPV_DIR"
          $exports = & dumpbin /exports libmpv-2.dll |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }

          @("EXPORTS") + ($exports | ForEach-Object { "    $_" }) | Set-Content mpv.def -Encoding ascii
          & lib /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          Write-Host "mpv.lib built from $($exports.Count) exports"

          # Copy DLL for bundling
          Copy-Item "$env:MPV_DIR\libmpv-2.dll" "$env:GITHUB_WORKSPACE\src-tauri\libmpv-2.dll" -Force

      - name: Last.fm keys
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [ -n "$LASTFM_API_KEY" ] && [ -n "$LASTFM_API_SECRET" ]; then
            printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
              "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > src-tauri/lastfm.keys
          else
            echo "::warning::Last.fm secrets not set — scrobbling disabled"
          fi

      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: -L native=${{ github.workspace }}\.libmpv
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || {
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret required"; exit 1; }
          (cd ui && pnpm build)
          tauri build --config '{"build":{"beforeBuildCommand":""}}'

      - name: Dry run
        if: ${{ inputs.dry_run }}
        shell: bash
        run: echo "dry_run — build succeeded, no assets uploaded"

      - name: Upload and update release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          EXE="target/release/bundle/nsis/limusic_${VERSION}_x64-setup.exe"
          MSI="$(ls target/release/bundle/msi/limusic_${VERSION}_*.msi 2>/dev/null | head -1 || true)"

          [ -f "$EXE" ] || { echo "::error::NSIS installer not found"; exit 1; }
          [ -f "$EXE.sig" ] || { echo "::error::signature not found"; exit 1; }

          gh release upload "$TAG" "$EXE" "$EXE.sig" ${MSI:+"$MSI"} --clobber

          # Merge into latest.json with retry for race with Linux job
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$EXE")"
          for i in 1 2 3 4 5; do
            rm -rf manifest check
            gh release download "$TAG" --pattern latest.json --dir manifest 2>/dev/null || true
            jq --arg sig "$(cat "$EXE.sig")" --arg url "$URL" \
              '.platforms["windows-x86_64"] = { signature: $sig, url: $url }' \
              manifest/latest.json 2>/dev/null > latest.json || echo '{"version":"'"$VERSION"'","platforms":{}}' > latest.json
            gh release upload "$TAG" latest.json --clobber
            sleep $((2 + RANDOM % 4))
            gh release download "$TAG" --pattern latest.json --dir check 2>/dev/null || true
            [ "$(jq -r '.platforms["windows-x86_64"].url // ""' check/latest.json)" = "$URL" ] && break
            echo "retry $i: clobbered by parallel job"
          done
          echo "Published. Platforms: $(jq -c '.platforms | keys' latest.json)"