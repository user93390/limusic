name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the Linux AppImage for (e.g. v0.2.9)
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

# Pinned to ubuntu-24.04 for glibc 2.39 floor — ubuntu-latest would silently raise it
permissions:
  contents: write

concurrency:
  group: linux-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate version
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          [ "v$VERSION" = "${{ inputs.tag }}" ] || {
            echo "::error::version $VERSION doesn't match tag ${{ inputs.tag }}"; exit 1; }

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libmpv-dev patchelf file libjack-jackd2-0 glib-networking

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend
        run: |
          npm install -g pnpm@10
          cd ui && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm install -g "@tauri-apps/cli@^2"

      - name: Last.fm keys
        run: |
          if [ -n "$LASTFM_API_KEY" ] && [ -n "$LASTFM_API_SECRET" ]; then
            printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
              "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > src-tauri/lastfm.keys
          fi
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Build AppImage
        if: ${{ !inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          (cd ui && pnpm build)
          tauri build --bundles appimage --config '{"build":{"beforeBuildCommand":""}}'
          scripts/fix-appdir-tls.sh

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: echo "dry_run — build step skipped"

      - name: Verify on foreign distros
        if: ${{ !inputs.dry_run }}
        run: |
          APPDIR="$PWD/target/release/bundle/appimage/limusic.AppDir"
          for image in debian:sid archlinux:latest; do
            echo "── $image"
            docker run --rm -v "$APPDIR:/app:ro" \
              -v "$PWD/scripts/appdir-foreign-check.sh:/check.sh:ro" "$image" bash /check.sh
          done

      - name: Upload
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          APPIMAGE="$(ls target/release/bundle/appimage/limusic_${VERSION}_*.AppImage | head -1)"

          [ -f "$APPIMAGE" ] && [ -f "$APPIMAGE.sig" ] || {
            echo "::error::AppImage or signature missing"; exit 1; }

          gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" --clobber
          echo "Uploaded: $(basename $APPIMAGE)"
