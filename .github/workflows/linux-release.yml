name: Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.3.0)
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: linux-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate version
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          [ "v$VERSION" = "${{ inputs.tag }}" ] || {
            echo "::error::version $VERSION doesn't match tag ${{ inputs.tag }}"; exit 1; }

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libmpv-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend deps
        run: |
          npm install -g pnpm@10
          cd ui && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - run: npm install -g "@tauri-apps/cli@^2"

      - name: Setup Nushell
        run: |
          curl -fsSL https://github.com/nushell/nushell/releases/latest/download/nux-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.local/bin nu

      - name: Last.fm keys
        run: |
          if [ -n "$LASTFM_API_KEY" ] && [ -n "$LASTFM_API_SECRET" ]; then
            printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
              "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > src-tauri/lastfm.keys
          fi
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Build deb/rpm
        if: ${{ !inputs.dry_run }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          (cd ui && pnpm build)
          ~/.local/bin/nu scripts/build/release.nu --tag ${{ inputs.tag }} --os linux

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: echo "dry_run — build step skipped"

      - name: Upload
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"

          DEB="$(ls target/release/bundle/deb/*.deb 2>/dev/null | head -1)"
          RPM="$(ls target/release/bundle/rpm/*.rpm 2>/dev/null | head -1)"

          [ -f "$DEB" ] || { echo "::error::deb not found"; exit 1; }
          [ -f "$RPM" ] || { echo "::error::rpm not found"; exit 1; }

          gh release upload "$TAG" "$DEB" "$RPM" --clobber
          echo "Uploaded: $(basename $DEB) $(basename $RPM)"