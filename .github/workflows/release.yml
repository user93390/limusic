name: CI release

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
    paths-ignore: [ 'website/**', 'docs/**', '*.md' ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_all:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo dnf install --setopt=install_weak_deps=False -y \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libayatana-appindicator-gtk3-devel \
            librsvg2-devel \
            openssl-devel \
            dbus-devel \
            mpv-devel \
            nushell

      - name: Setup pnpm
        shell: bash
        run: |
          SHELL=bash
          
          npm install -g pnpm@10

          pnpm setup --force
          pnpm install -g typescript

          cd ./ui && pnpm install --frozen-lockfile

      - name: Install tauri-cli
        run: |
          sudo dnf install --setopt=install_weak_deps=False -y gcc pkg-config openssl-devel
          cargo install tauri-cli



      - name: Last.fm keys
        if: ${{ env.LASTFM_API_KEY != '' && env.LASTFM_API_SECRET != '' }}
        run: |
          printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
            "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > src-tauri/lastfm.keys

      - name: build_bin
        shell: nu {0}
        if: ${{ github.ref_type == 'tag' }}
        working-directory: ${{ github.workspace }}
        run: |
          sudo dnf install -y mingw64-gcc-c++ mingw64-nsis

          nu scripts/build/release.nu ${{ github.ref_name }} --os linux

          cargo tauri build --bundles deb,rpm

          rustup target add x86_64-pc-windows-gnu
          cargo tauri build --target x86_64-pc-windows-gnu --bundles nsis
      - name: create_release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/limusic
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-gnu/release/limusic.exe
