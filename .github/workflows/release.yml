---
name: CI release

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
    paths-ignore: [ 'website/**', 'docs/**', '*.md' ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_linux:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
      RUSTFLAGS: "-C linker=clang -C link-arg=-fuse-ld=lld"
      CC: clang
      CXX: clang++

      SHELL: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo dnf install --setopt=install_weak_deps=False -y \
            webkit2gtk4.1-devel \
            gtk3-devel \
            libayatana-appindicator-gtk3-devel \
            librsvg2-devel \
            openssl-devel \
            dbus-devel \
            mpv-devel \
            nushell \
            pkg-config \
            clang \
            gcc-c++ \
            lld \
            gcc

      - name: Setup pnpm
        shell: bash
        run: |
              npm install -g pnpm@10

              export PNPM_HOME="/github/home/.local/share/pnpm"
              export PATH="$PNPM_HOME:$PATH"

              pnpm setup --force
              pnpm install -g typescript
              cd ./ui

              pnpm install --frozen-lockfile
              pnpm build

      - name: Install tauri-cli
        shell: bash
        run: |
          pnpm add -D @tauri-apps/cli

      - name: Last.fm keys
        if: ${{ env.LASTFM_API_KEY != '' && env.LASTFM_API_SECRET != '' }}
        run: |
          printf 'LIMUSIC_LASTFM_API_KEY=%s\nLIMUSIC_LASTFM_API_SECRET=%s\n' \
            "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > src-tauri/lastfm.keys

      - name: build_bin
        shell: nu {0}
        if: ${{ github.ref_type == 'tag' }}
        working-directory: ${{ github.workspace }}
        run: |
          nu scripts/build/ci.nu
      - name: create_release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2

        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./target/release/bundle/deb/*.deb
            ./target/release/bundle/rpm/*.rpm
            ./target/release/limusic
  build_windows:
    runs-on: windows-latest
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm get.scoop.sh | iex

          $shims = "$env:USERPROFILE\scoop\shims"
          Add-Content -Path $env:GITHUB_PATH -Value $shims
          $env:PATH = "$shims;$env:PATH"

      - name: Install dependencies
        shell: pwsh
        run: |
          scoop bucket add extras
          scoop bucket add versions

          scoop install git 7zip rustup llvm nodejs24 mingw
          rustup default stable

      - name: Install nu
        shell: pwsh
        run: |
          $version = "0.101.0"
          $arch = "x86_64-pc-windows-msvc"
          $url = "https://github.com/nushell/nushell/releases/download/$version/nu-$version-$arch.zip"
          Invoke-WebRequest -Uri $url -OutFile "nu.zip"
          Expand-Archive -Path "nu.zip" -DestinationPath "$env:LOCALAPPDATA\nu"
          Remove-Item "nu.zip"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\nu"

      - name: Set up pnpm
        run: |
          npm install -g pnpm@10
          pnpm setup

          cd ./ui

          pnpm approve-builds --all
          pnpm install --frozen-lockfile

          pnpm build

      - name: Install tauri-cli
        shell: pwsh
        run: |
          pnpm add -D @tauri-apps/cli

      - name: Last.fm keys
        if: ${{ env.LASTFM_API_KEY != '' && env.LASTFM_API_SECRET != '' }}
        shell: pwsh
        run: |
          "$env:LASTFM_API_KEY" | Out-File -FilePath "src-tauri/lastfm.keys" -Encoding utf8
          "$env:LASTFM_API_SECRET" | Out-File -FilePath "src-tauri/lastfm.keys" -Encoding utf8 -Append

      - name: Set env for build
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "LIMUSIC_LASTFM_API_KEY=$env:LASTFM_API_KEY"
          Add-Content -Path $env:GITHUB_ENV -Value "LIMUSIC_LASTFM_API_SECRET=$env:LASTFM_API_SECRET"

      - name: Locate MSVC tools
        shell: pwsh
        run: |
          Import-Module VSSetup -ErrorAction Stop

          $vs = Get-VSSetupInstance -Prerelease -All |
            Where-Object { $_.DisplayName -match "Visual Studio" } |
            Select-Object -First 1

          if (-not $vs) {
              throw "No Visual Studio instance found"
          }

          $vcToolsRoot = Join-Path $vs.InstallationPath "VC\Tools\MSVC"

          if (-not (Test-Path $vcToolsRoot)) {
              throw "VC Tools MSVC directory not found at: $vcToolsRoot"
          }

          $msvcVersion = Get-ChildItem $vcToolsRoot -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $msvcVersion) {
              throw "No MSVC version folder found in: $vcToolsRoot"
          }

          $vcToolsBin = Join-Path $msvcVersion.FullName "bin\Hostx64\x64"

          if (-not (Test-Path $vcToolsBin)) {
              throw "VC Tools bin directory not found at: $vcToolsBin"
          }

          if (-not (Test-Path "$vcToolsBin\dumpbin.exe")) {
              throw "dumpbin.exe not found in: $vcToolsBin"
          }

          if (-not (Test-Path "$vcToolsBin\lib.exe")) {
              throw "lib.exe not found in: $vcToolsBin"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $vcToolsBin

          Write-Host "VS installation path: $($vs.InstallationPath)"
          Write-Host "MSVC version: $($msvcVersion.Name)"
          Write-Host "VC Tools bin: $vcToolsBin"
          Write-Host "dumpbin: $vcToolsBin\dumpbin.exe"
          Write-Host "lib.exe: $vcToolsBin\lib.exe"

      - name: Download and prepare libmpv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z"

          $archive = "mpv-dev.7z"
          $extractDir = "mpv-dev"
          $destinationDir = "src-tauri"

          Invoke-WebRequest -Uri $url -OutFile $archive

          7z x $archive "-o$extractDir" -y

          $dll = Get-ChildItem $extractDir -Recurse -File -Filter "libmpv-2.dll" | Select-Object -First 1

          if (-not $dll) {
              throw "libmpv-2.dll not found in archive"
          }

          Copy-Item $dll.FullName "$destinationDir\libmpv-2.dll" -Force

          Write-Host "Creating import library from DLL using MSVC tools..."
          $dllPath = (Resolve-Path "$destinationDir\libmpv-2.dll").Path
          $exports = & dumpbin /exports $dllPath | Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $defContent = "EXPORTS`n" + ($exports | ForEach-Object { "    $_" }) -join "`n"
          Set-Content -Path "$destinationDir\mpv.def" -Value $defContent -Encoding ascii
          & lib /def:"$destinationDir\mpv.def" /name:libmpv-2.dll /out:"$destinationDir\mpv.lib" /machine:x64

          Remove-Item $archive -Force
          Remove-Item $extractDir -Recurse -Force

      - name: Set env for linker
        shell: pwsh
        run: |
          $srcDir = (Resolve-Path src-tauri).Path
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTFLAGS=-L native=$srcDir"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$srcDir;$env:LIB"

      - name: build_bin
        shell: pwsh
        if: ${{ github.ref_type == 'tag' }}
        working-directory: ${{ github.workspace }}
        run: |
          nu scripts/build/ci.nu
          
      - name: create_release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe