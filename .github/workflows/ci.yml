name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['website/**', 'docs/**', '*.md']
  pull_request:
    paths-ignore: ['website/**', 'docs/**', '*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend deps
        run: |
          npm install -g pnpm@10
          cd ui && pnpm install --frozen-lockfile

      - name: Rust
        if: matrix.os != 'windows-latest'
        run: rustup default stable

      - name: Rust (MSVC)
        if: matrix.os == 'windows-latest'
        run: rustup default stable-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target


      - name: Setup Nushell
        shell: bash
        env:
          NU_VERSION: "0.114.1"
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
            set -euo pipefail
        
            sudo mkdir -p /etc/apt/keyrings
        
            curl -fsSL https://apt.fury.io/nushell/gpg.key \
              | sudo gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg
        
            echo "deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /" \
              | sudo tee /etc/apt/sources.list.d/fury-nushell.list > /dev/null
            sudo apt-get install -y nushell
            
            windows-latest)
              winget install --id Nushell.Nushell --exact --silent --accept-package-agreements --accept-source-agreements ;;
            macos-latest)
              brew install nushell ;;
          esac

      - name: Build
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  nu scripts/build/ci.nu ;;
            windows-latest) "$env:LOCALAPPDATA\nushell\nu.exe" scripts/build/ci.nu ;;
            macos-latest)   nu scripts/build/ci.nu ;;
          esac
