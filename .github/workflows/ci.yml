name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['website/**', 'docs/**', '*.md']
  pull_request:
    paths-ignore: ['website/**', 'docs/**', '*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend deps
        run: |
          npm install -g pnpm@10
          cd ui && pnpm install --frozen-lockfile

      - name: Rust
        if: matrix.os != 'windows-latest'
        run: rustup default stable

      - name: Rust (MSVC)
        if: matrix.os == 'windows-latest'
        run: rustup default stable-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup Nushell
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              curl -fsSL https://github.com/nushell/nushell/releases/latest/download/nux-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.local/bin nu
              ;;
            windows-latest)
              curl -fsSL https://github.com/nushell/nushell/releases/latest/download/nushell-0.114.1-x86_64-pc-windows-msvc.zip -o nushell.zip
              7z x nushell.zip -o"$env:LOCALAPPDATA\nushell" -y | Out-Null
              ;;
            macos-latest)
              brew install nushell
              ;;
          esac

      - name: Build
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  ~/.local/bin/nu scripts/build/ci.nu ;;
            windows-latest) "$env:LOCALAPPDATA\nushell\nu.exe" scripts/build/ci.nu ;;
            macos-latest)   nu scripts/build/ci.nu ;;
          esac