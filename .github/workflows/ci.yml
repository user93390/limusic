name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['website/**', 'docs/**', '*.md']
  pull_request:
    paths-ignore: ['website/**', 'docs/**', '*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check

  build-linux:
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts (Linux)
        run: |
            apk add --no-cache nushell
      - name: Build
        run: nu scripts/build/ci.nu

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts (Windows)
        run: winget install --id Nushell.Nushell --exact --silent --accept-package-agreements --accept-source-agreements

      - name: Build
        run: nu scripts/build/ci.nu

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts (Macos)
        run: brew install nushell

      - name: Build
        run: nu scripts/build/ci.nu
